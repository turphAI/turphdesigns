name: gitleaks
# Secret scanning for turphdesigns.com (public, Vercel). CI-native because the
# ops-loop sweep can't reach this repo. Full-history scan (fetch-depth 0) — on a
# public repo a secret committed anywhere in history is exposed. gitleaks-action
# is license-free for public repositories. See turphPWA design-journal 028.
on:
  push:
  pull_request:
permissions:
  contents: read
  pull-requests: read  # gitleaks-action lists the PR's commits via the API
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          # Required for pull_request-triggered scans; without it the action
          # aborts before scanning (gitleaks-action v2 breaking change).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
